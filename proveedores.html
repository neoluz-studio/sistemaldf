<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Proveedores
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/ventas.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

<!-- ================================= -->
<!-- LAYOUT -->
<!-- ================================= -->

<div class="layout">

  <!-- ================================= -->
  <!-- SIDEBAR -->
  <!-- ================================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <div class="brand">

        <div class="brand-icon">

          <img
            src="assets/icons/images/logo.png"
            alt="FAUSTI"
          >

        </div>

        <div class="brand-text"></div>

      </div>

    </div>

    <!-- NAV -->
  <nav class="sidebar-nav">

      <a href="index.html" class="nav-link ">

  <i class="fa-solid fa-house"></i>

  <b>Inicio</b>

</a>

      <a href="ventas.html" class="nav-link ">

  <i class="fa-solid fa-cart-shopping"></i>

  <b>Ventas</b>

</a>

      <a href="productos.html" class="nav-link">

  <i class="fa-solid fa-box"></i>

  <b>Productos</b>

</a>

      <a href="caja.html" class="nav-link ">

  <i class="fa-solid fa-cash-register"></i>

  <b>Caja</b>

</a>
      <a href="produccion.html" class="nav-link">

  <i class="fa-solid fa-industry"></i>

  <b>Producción</b>

</a>

      <a href="proveedores.html" class="nav-link active">

  <i class="fa-solid fa-truck"></i>

  <b>Proveedores</b>

</a>
 <a href="historial.html" class="nav-link">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <b>Historial</b>
      </a>

     
  </nav>

    <!-- USER -->
    <div class="user-box">

      <div class="user-info">

        <small class="user-role">
          Sesión activa
        </small>

      </div>

      <button
        type="button"
        onclick="logout()"
        class="switch-btn"
      >

         Cerrar Sesión

      </button>

    </div>

  </aside>

  <!-- OVERLAY -->
  <div
    id="sidebarOverlay"
    class="sidebar-overlay"
    onclick="toggleSidebar()"
  ></div>

  <!-- ================================= -->
  <!-- MAIN -->
  <!-- ================================= -->

  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <h2>
        🚚 Proveedores
      </h2>

      <button
  type="button"
  class="menu-toggle"
  onclick="window.toggleSidebar()"
>
  ☰
</button>
    </div>

    <!-- ================================= -->
    <!-- CONTENT -->
    <!-- ================================= -->

    <div class="page-content">

      <!-- ================================= -->
      <!-- STATS -->
      <!-- ================================= -->

      <div class="stats-grid fade-in">

        <div class="stat-card">

          <h3>
            Proveedores
          </h3>

          <h2 id="totalProveedores">
            0
          </h2>

        </div>

        <div class="stat-card">

          <h3>
            Deuda total
          </h3>

          <h2 id="deudaTotal">
            $0
          </h2>

        </div>

        <div class="stat-card">

          <h3>
            Total pagado
          </h3>

          <h2 id="totalPagado">
            $0
          </h2>

        </div>

      </div>

      <!-- ================================= -->
      <!-- NUEVA COMPRA -->
      <!-- ================================= -->

      <div class="box fade-in">

        <h3>
          Registrar compra
        </h3>

        <div class="form product-form">

          <input
            type="text"
            id="nombreProveedor"
            placeholder="Proveedor"
            autocomplete="off"
          >

          <input
            type="text"
            id="montoCompra"
            placeholder="Monto total"
            min="0"
          >

          <input
            type="text"
            id="montoPagado"
            placeholder="Monto pagado"
            min="0"
          >

          <button
            type="button"
            onclick="registrarCompraProveedor()"
          >

            Registrar compra

          </button>

        </div>

      </div>

      <!-- ================================= -->
      <!-- PAGAR -->
      <!-- ================================= -->

      <div
        class="box fade-in"
        style="margin-top:20px;"
      >

        <h3>
          Pagar deuda
        </h3>

        <div class="form product-form">

          <select id="cuentaSelect"></select>

          <input
            type="text"
            id="montoPago"
            placeholder="Monto a pagar"
            min="0"
          >

          <button
            type="button"
            onclick="pagarCuenta()"
          >

            Registrar pago

          </button>

        </div>

      </div>

      <!-- ================================= -->
      <!-- TABLA -->
      <!-- ================================= -->

      <div
        class="table-box fade-in"
        style="margin-top:30px;"
      >

        <div class="table-header">

          <h3>
            Historial proveedores
          </h3>

        </div>

        <table class="pro-table">

          <thead>

            <tr>

              <th>
                Proveedor
              </th>

              <th>
                Total
              </th>

              <th>
                Pagado
              </th>

              <th>
                Deuda
              </th>

              <th>
                Estado
              </th>

              <th>
                Fecha
              </th>

              <th>
                Acciones
              </th>

            </tr>

          </thead>

          <tbody id="listaProveedores">

            <tr>

              <td colspan="7">

                No hay registros

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>

</div>

<!-- ================================= -->
<!-- COMMAND PALETTE -->
<!-- ================================= -->

<div
  id="commandPalette"
  class="command-palette hidden"
>

  <div class="command-box">

    <input
      type="text"
      id="commandInput"
      placeholder="Buscar módulos..."
      autocomplete="off"
      oninput="buscarGlobal()"
    >

    <div id="commandResults"></div>

  </div>

</div>

<!-- ================================= -->
<!-- SCRIPTS -->
<!-- ================================= -->

<script
  defer
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"
  onerror="console.error('Error cargando Supabase')"
></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/supabase.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/toast.js"></script>
<script defer src="js/roles.js"></script>
<script defer src="js/proveedores.js"></script>
<script defer src="js/app.js"></script>
<script>
window.toggleSidebar = function () {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");

  if (!sidebar) return;

  sidebar.classList.toggle("active");

  if (overlay) {
    overlay.classList.toggle("active");
  }
};
</script>
</body>
</html>
