<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proveedores</title>
  <link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/ventas.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/darkmode.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon"></div>
      <div>
        <h2>Lo de Fausti</h2>
      </div>
    </div>

    <button class="collapse-btn" onclick="toggleSidebar()">☰</button>
  </div>

  <nav class="sidebar-nav">
    <a href="index.html" class="nav-link ">
      <b>Inicio</b>
    </a>

    <a href="ventas.html" class="nav-link">
      <b>Ventas</b>
    </a>

    <a href="productos.html" class="nav-link">
      <b>Productos</b>
    </a>

    <a href="caja.html" class="nav-link">
      <b>Caja</b>
    </a>

    <a href="produccion.html" class="nav-link">
      <b>Producción</b>
    </a>

    <a href="proveedores.html" class="nav-link admin-only active">
      <b>Proveedores</b>
    </a>
    <a href="historial.html" class="nav-link admin-only">
        <b>Historial</b>
      </a>
  </nav>

  <div class="user-box">

  <div class="user-avatar">
    👤
  </div>

  <div class="user-info">

    <p id="userNombre">
      Usuario
    </p>

    <small class="user-role">
      Sesión activa
    </small>

  </div>

  <button
    onclick="window.location.href='login.html'"
    class="switch-btn"
  >
    🔄 Cambiar cuenta
  </button>

  <button
    onclick="logout()"
    class="logout-btn"
  >
    🚪 Cerrar sesión
  </button>

  <button
    onclick="toggleDarkMode()"
    class="logout-btn"
  >
    🌙 Modo oscuro
  </button>

</div>

  </aside>

  <main class="main">
<div class="main">
  <h1>Proveedores</h1>

  <div class="grid-2">

    <!-- CREAR -->
    <div class="box">
      <h3>Nuevo proveedor</h3>
      <div class="form">
        <input id="nombreProv" placeholder="Nombre proveedor">
        <button onclick="agregarProveedor()">Agregar</button>
      </div>
    </div>

    <!-- DEUDA -->
    <div class="box">
      <h3>Cargar deuda</h3>
      <div class="form">
        <select id="proveedorSelect"></select>
        <input type="number" id="montoTotal" placeholder="Monto total">
        <button onclick="agregarCuenta()">Registrar</button>
      </div>
    </div>

  </div>

  <div class="grid-2" style="margin-top:20px;">

    <!-- PAGAR -->
    <div class="box">
      <h3>Pagar deuda</h3>
      <div class="form">
        <select id="cuentaSelect"></select>
        <input type="number" id="montoPago" placeholder="Monto">
        <button onclick="pagarCuenta()">Pagar</button>
      </div>
    </div>

  </div>

  <!-- LISTA -->
  <div style="margin-top:30px;">
    <h2>Cuentas</h2>
    <div id="listaCuentas" class="lista"></div>
  </div>
</div>

  </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/roles.js"></script>
<script src="js/proveedores.js"></script>
<div id="commandPalette" class="command-palette hidden">

  <div class="command-box">

    <input
      type="text"
      id="commandInput"
      placeholder="Buscar productos, ventas o módulos..."
      oninput="buscarGlobal()"
    >

    <div id="commandResults"></div>

  </div>

</div>
</body>
</html>
