<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Ventas</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/ventas.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>

<div class="layout">

  <aside class="sidebar" id="sidebar">

    <div class="brand-icon">
      <img
        src="assets/icons/images/logo.png"
        alt="FAUSTI"
      >
    </div>

    <nav class="sidebar-nav">

      <a href="index.html" class="nav-link">
        <i class="fa-solid fa-house"></i>
        <b>Inicio</b>
      </a>

      <a href="ventas.html" class="nav-link active">
        <i class="fa-solid fa-cart-shopping"></i>
        <b>Ventas</b>
      </a>

      <a href="productos.html" class="nav-link">
        <i class="fa-solid fa-box"></i>
        <b>Productos</b>
      </a>

      <a href="caja.html" class="nav-link">
        <i class="fa-solid fa-cash-register"></i>
        <b>Caja</b>
      </a>

      <a href="produccion.html" class="nav-link">
        <i class="fa-solid fa-industry"></i>
        <b>Producción</b>
      </a>

      <a href="proveedores.html" class="nav-link">
        <i class="fa-solid fa-truck"></i>
        <b>Proveedores</b>
      </a>

      <a href="historial.html" class="nav-link">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <b>Historial</b>
      </a>

    </nav>

    <div class="user-box">

      <div class="user-info">
        <small class="user-role">
          Sesión activa
        </small>
      </div>

      <button
        type="button"
        onclick="logout()"
        class="switch-btn"
      >
        Cerrar Sesión
      </button>

    </div>

  </aside>

  <div
    id="sidebarOverlay"
    class="sidebar-overlay"
    onclick="toggleSidebar()"
  ></div>

  <main class="main">

    <div class="topbar">

      <button
  type="button"
  class="menu-toggle"
  onclick="window.toggleSidebar()"
>
  ☰
</button>

      

    </div>

    <div class="page-content">

      <div class="ventas-pro-grid">

        <!-- PRODUCTOS -->
        <div class="box productos-panel">

          <div class="ventas-header">
            <div>
              <h3>Productos</h3>
              <p>Seleccioná productos para agregar al carrito</p>
            </div>
          </div>

          <input
            type="text"
            id="buscador"
            placeholder="Buscar producto..."
            oninput="filtrarProductos()"
            class="search-input"
          />

          <div
            id="productosGrid"
            class="productos-grid"
          ></div>

        </div>

        <!-- CARRITO -->
        <div class="box carrito-box">

          <div class="ventas-header">
            <div>
              <h3>Carrito</h3>
              <p>Venta actual</p>
            </div>
          </div>

          <div
            id="carritoLista"
            class="carrito-lista"
          ></div>

          <!-- DESCUENTO GENERAL -->
          <div class="discount-box">

            <div class="discount-title">
              <strong>Descuento general</strong>
              <small>Aplicado al total del carrito</small>
            </div>

            <div class="discount-controls">

              <select
                id="tipoDescuentoCarrito"
                onchange="actualizarDescuentoCarrito()"
              >
                <option value="porcentaje">Porcentaje %</option>
                <option value="monto">Monto $</option>
              </select>

              <input
  type="number"
  id="valorDescuentoCarrito"
  placeholder="0"
  min="0"
  oninput="actualizarDescuentoCarrito()"
  onkeydown="if(event.key === 'Enter'){ event.preventDefault(); actualizarDescuentoCarrito(); this.blur(); }"
>
            </div>

          </div>

          <!-- RESUMEN TOTAL -->
          <div class="venta-summary">

            <div>
              <span>Subtotal</span>
              <strong id="subtotalVenta">$0</strong>
            </div>

            <div>
              <span>Desc. productos</span>
              <strong id="descuentoProductos">-$0</strong>
            </div>

            <div>
              <span>Desc. carrito</span>
              <strong id="descuentoCarrito">-$0</strong>
            </div>

          </div>

          <!-- TOTAL -->
          <div class="total-box">
            <span>Total</span>
            <h2>
              $<span id="total">0</span>
            </h2>
          </div>

          <!-- PAGOS -->
          <div class="payment-actions">

            <button
              type="button"
              onclick="finalizarVenta('efectivo')"
            >
              💵 Efectivo
            </button>

            <button
              type="button"
              onclick="finalizarVenta('transferencia')"
            >
              🏦 Transferencia
            </button>

            <button
              type="button"
              onclick="finalizarVenta('mp')"
            >
              📲 Mercado Pago
            </button>

            <button
              type="button"
              onclick="finalizarVenta('qr')"
            >
              🔳 QR
            </button>

            <button
              type="button"
              onclick="finalizarVenta('qr_banco')"
            >
              🏦 QR Banco
            </button>

            <button
              type="button"
              onclick="finalizarVenta('promo_bn')"
            >
              🇦🇷 Promo Nación
            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>

<div
  id="commandPalette"
  class="command-palette hidden"
></div>

<!-- SCRIPTS -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/supabase.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/toast.js"></script>
<script defer src="js/roles.js"></script>
<script defer src="js/ventas.js"></script>
<script defer src="js/app.js"></script>
<script>
window.toggleSidebar = function () {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");

  if (!sidebar) return;

  sidebar.classList.toggle("active");

  if (overlay) {
    overlay.classList.toggle("active");
  }
};
</script>
</body>
</html>
