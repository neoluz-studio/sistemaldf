<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ventas</title>
  <link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/ventas.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/darkmode.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<body>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">🧊</div>
        <div>
          <h2>Fausti</h2>
          <p>Sistema de Gestión</p>
        </div>
      </div>
      <button class="collapse-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="nav-link"><b>Inicio</b></a>
      <a href="ventas.html" class="nav-link active"><b>Ventas</b></a>
      <a href="productos.html" class="nav-link"><b>Productos</b></a>
      <a href="caja.html" class="nav-link"><b>Caja</b></a>
      <a href="produccion.html" class="nav-link"><b>Producción</b></a>
      <a href="proveedores.html" class="nav-link admin-only"><b>Proveedores</b></a>
      <a href="historial.html" class="nav-link admin-only"><b>Historial</b></a>
    </nav>

   <div class="user-box">

  <div class="user-avatar">
    👤
  </div>

  <div class="user-info">

    <p id="userNombre">
      Usuario
    </p>

    <small class="user-role">
      Sesión activa
    </small>

  </div>

  <button
    onclick="window.location.href='login.html'"
    class="switch-btn"
  >
    🔄 Cambiar cuenta
  </button>

  <button
    onclick="logout()"
    class="logout-btn"
  >
    🚪 Cerrar sesión
  </button>

  <button
    onclick="toggleDarkMode()"
    class="logout-btn"
  >
    🌙 Modo oscuro
  </button>

</div>
  </aside>

  <main class="main">

    <div class="topbar">
      <h2>🛒 Ventas POS</h2>
      <span class="badge">Caja rápida</span>
    </div>

    <div class="page-content">

      <div class="ventas-pro-grid">

        <div class="box">
          <h3>Productos</h3>
          <input id="buscador" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
          <div id="productosGrid" class="productos-grid"></div>
        </div>

        <div class="box carrito-box">
          <h3>Carrito</h3>

          <div id="carritoLista" class="carrito-lista"></div>

          <div class="total-box">
            Total: $<span id="total">0</span>
          </div>

          <div class="pagos">
            <button onclick="finalizarVenta('efectivo')">💵 Efectivo</button>
            <button onclick="finalizarVenta('transferencia')">🏦 Transferencia</button>
            <button onclick="finalizarVenta('mp')">📲 Mercado Pago</button>
          </div>
        </div>

      </div>

    </div>

  </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/roles.js"></script>
<script src="js/ventas.js"></script>
<script src="js/app.js"></script>
<div id="commandPalette" class="command-palette hidden">

  <div class="command-box">

    <input
      type="text"
      id="commandInput"
      placeholder="Buscar productos, ventas o módulos..."
      oninput="buscarGlobal()"
    >

    <div id="commandResults"></div>

  </div>

</div>
</body>
</html>
