<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Ventas
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/ventas.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- ================================= -->
<!-- LAYOUT -->
<!-- ================================= -->

<div class="layout">

  <!-- ================================= -->
  <!-- SIDEBAR -->
  <!-- ================================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >

  <div class="brand-icon">

  <img
    src="assets/icons/images/logo.png"
    alt="FAUSTI"
  >

</div>

<div class="brand-text">


</div>

    <!-- NAV -->
    <nav class="sidebar-nav">

      <a
        href="index.html"
        class="nav-link"
      >
        <b>Inicio</b>
      </a>

      <a
        href="ventas.html"
        class="nav-link active"
      >
        <b>Ventas</b>
      </a>

      <a
        href="productos.html"
        class="nav-link"
      >
        <b>Productos</b>
      </a>

      <a
        href="caja.html"
        class="nav-link"
      >
        <b>Caja</b>
      </a>

      <a
        href="produccion.html"
        class="nav-link"
      >
        <b>Producción</b>
      </a>

      <a
        href="proveedores.html"
        class="nav-link admin-only"
      >
        <b>Proveedores</b>
      </a>

      

    </nav>

    <!-- USER -->
    <div class="user-box">

      <div class="user-info">

        <small class="user-role">
          Sesión activa
        </small>

      </div>

      <button
        type="button"
        onclick="logout()"
        class="switch-btn"
      >

        Cerrar Sesión

      </button>

    </div>

  </aside>

  <!-- ================================= -->
  <!-- MAIN -->
  <!-- ================================= -->

  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <h2>
        🛒 Ventas POS
      </h2>

    </div>

    <!-- CONTENT -->
    <div class="page-content">

      <div class="ventas-pro-grid">

        <!-- PRODUCTOS -->
        <div class="box">

          <h3>
            Productos
          </h3>
        <input
          type="text"
          id="buscador"
          placeholder="Buscar producto..."
          oninput="filtrarProductos()"
          class="search-input"
        />
          <div
            id="productosGrid"
            class="productos-grid"
          ></div>

        </div>

        <!-- CARRITO -->
        <div class="box carrito-box">

          <h3>
            Carrito
          </h3>

          <div
            id="carritoLista"
            class="carrito-lista"
          ></div>

          <!-- TOTAL -->
          <div class="total-box">

            Total:
            $<span id="total">0</span>

          </div>

          <!-- PAGOS -->
          <div class="payment-actions">

  <button
    type="button"
    onclick="finalizarVenta('efectivo')"
  >
    💵 Efectivo
  </button>

  <button
    type="button"
    onclick="finalizarVenta('transferencia')"
  >
    🏦 Transferencia
  </button>

  <button
    type="button"
    onclick="finalizarVenta('mp')"
  >
    📲 Mercado Pago
  </button>

  <button
    type="button"
    onclick="finalizarVenta('qr')"
  >
    🔳 QR
  </button>

  <button
    type="button"
    onclick="finalizarVenta('qr_banco')"
  >
    🏦 QR Banco
  </button>

  <button
    type="button"
    onclick="finalizarVenta('promo_bn')"
  >
    🇦🇷 Promo Nación
  </button>


  </div>

</div>
</div>

        </div>

      </div>

    </div>

  </main>

</div>

<!-- ================================= -->
<!-- COMMAND PALETTE -->
<!-- ================================= -->

<div
  id="commandPalette"
  class="command-palette hidden"
></div>

<!-- ================================= -->
<!-- SCRIPTS -->
<!-- ================================= -->

<!-- ========================= -->
<!-- MODAL TICKET -->
<!-- ========================= -->

<div id="ticketModal" class="ticket-modal hidden">

  <div class="ticket-box">

    <div id="ticketContenido"></div>

    <div class="ticket-actions">

      <button onclick="imprimirTicket()">
        🖨 Imprimir
      </button>

      <button onclick="cerrarTicket()">
        ✖ Cerrar
      </button>

    </div>

<script defer src="js/supabase.js"></script>

<script defer src="js/storage.js"></script>

<script defer src="js/auth.js"></script>

<script defer src="js/toast.js"></script>

<script defer src="js/roles.js"></script>

<script defer src="js/ventas.js"></script>

<script defer src="js/app.js"></script>

</body>
</html>
