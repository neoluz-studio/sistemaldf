<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Producción
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/ventas.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- ================================= -->
<!-- LAYOUT -->
<!-- ================================= -->

<div class="layout">

  <!-- ================================= -->
  <!-- SIDEBAR -->
  <!-- ================================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <div class="brand">

         <div class="brand-icon">

  <img
    src="assets/icons/images/logo.png"
    alt="FAUSTI"
  >

</div>

<div class="brand-text">


</div>

      </div>

    </div>

    <!-- NAV -->
    <nav class="sidebar-nav">

      <a
        href="index.html"
        class="nav-link"
      >
        <b>Inicio</b>
      </a>

      <a
        href="ventas.html"
        class="nav-link"
      >
        <b>Ventas</b>
      </a>

      <a
        href="productos.html"
        class="nav-link"
      >
        <b>Productos</b>
      </a>

      <a
        href="caja.html"
        class="nav-link"
      >
        <b>Caja</b>
      </a>

      <a
        href="produccion.html"
        class="nav-link active"
      >
        <b>Producción</b>
      </a>

      <a
        href="proveedores.html"
        class="nav-link admin-only"
      >
        <b>Proveedores</b>
      </a>

      

    </nav>

    <!-- USER -->
    <div class="user-box">

      <div class="user-info">

        <small class="user-role">
          Sesión activa
        </small>

      </div>

      <button
        type="button"
       onclick="logout()"
        class="switch-btn"
      >

        🔄 Cerrar Sesión

      </button>

    </div>

  </aside>
<div
  id="sidebarOverlay"
  class="sidebar-overlay"
  onclick="toggleSidebar()"
></div>
  <!-- ================================= -->
  <!-- MAIN -->
  <!-- ================================= -->

  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <h2>
        🏭 Producción
      </h2>

      <span class="badge">
        Recetas por kilo / unidad
      </span>
<button
  class="menu-toggle"
  onclick="toggleSidebar()"
>
  ☰
</button>
    </div>

    <!-- CONTENT -->
    <div class="page-content">

      <div class="grid-2">

        <!-- ================================= -->
        <!-- CREAR RECETA -->
        <!-- ================================= -->

        <div class="box fade-in">

          <h3>
            Crear receta por unidad / kilo
          </h3>

          <div class="form production-form">

            <select id="productoFinal"></select>

            <select id="insumoSelect"></select>

            <input
              type="number"
              id="cantidadInsumo"
              placeholder="Cantidad usada por 1 kg/unidad"
              step="0.001"
              min="0"
            >

            <button
              type="button"
              onclick="agregarIngrediente()"
            >

              Agregar ingrediente

            </button>

            <button
              type="button"
              onclick="guardarReceta()"
            >

              Guardar receta

            </button>

          </div>

        </div>

        <!-- ================================= -->
        <!-- PRODUCIR -->
        <!-- ================================= -->

        <div class="box fade-in">

          <h3>
            Producir
          </h3>

          <div class="form production-form">

            <select id="recetaSelect"></select>

            <input
              type="number"
              id="cantidadProducir"
              placeholder="Cantidad a producir"
              step="0.001"
              min="0"
            >

            <button
              type="button"
              class="btn-producir"
              onclick="producirDesdeFormulario()"
            >

              Producir

            </button>

          </div>

        </div>

      </div>

      <!-- ================================= -->
      <!-- RECETAS -->
      <!-- ================================= -->

      <div class="table-box fade-in">

        <div class="table-header">

          <h3>
            Recetas guardadas
          </h3>

        </div>

        <div
          id="listaRecetas"
          class="lista"
        ></div>

      </div>

    </div>

  </main>

</div>

<!-- ================================= -->
<!-- COMMAND PALETTE -->
<!-- ================================= -->

<div
  id="commandPalette"
  class="command-palette hidden"
>

  <div class="command-box">

    <input
      type="text"
      id="commandInput"
      placeholder="Buscar productos, ventas o módulos..."
      autocomplete="off"
      oninput="buscarGlobal()"
    >

    <div id="commandResults"></div>

  </div>

</div>

<!-- ================================= -->
<!-- SCRIPTS -->
<!-- ================================= -->

<script
  defer
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"
  onerror="console.error('Error cargando Supabase')"
></script>

<script defer src="js/supabase.js"></script>

<script defer src="js/storage.js"></script>

<script defer src="js/auth.js"></script>

<script defer src="js/toast.js"></script>

<script defer src="js/roles.js"></script>

<script defer src="js/produccion.js"></script>

<script defer src="js/app.js"></script>

</body>
</html>
