<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Historial
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/ventas.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/historial.css">

</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <div class="brand">

        <div class="brand-icon">

          <img
            src="assets/icons/images/logo.png"
            alt="FAUSTI"
          >

        </div>

      </div>

    </div>

    <nav class="sidebar-nav">

      <a
        href="index.html"
        class="nav-link"
      >
        <b>Inicio</b>
      </a>

      <a
        href="ventas.html"
        class="nav-link"
      >
        <b>Ventas</b>
      </a>

      <a
        href="productos.html"
        class="nav-link"
      >
        <b>Productos</b>
      </a>

      <a
        href="caja.html"
        class="nav-link"
      >
        <b>Caja</b>
      </a>

      <a
        href="produccion.html"
        class="nav-link"
      >
        <b>Producción</b>
      </a>

      <a
        href="proveedores.html"
        class="nav-link"
      >
        <b>Proveedores</b>
      </a>

      <a
        href="historial.html"
        class="nav-link active"
      >
        <b>Historial</b>
      </a>

    </nav>

    <div class="user-box">

      <div class="user-info">

        <small class="user-role">
          Sesión activa
        </small>

      </div>

      <button
        type="button"
        onclick="logout()"
        class="switch-btn"
      >
        Cerrar Sesión
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-left">

        <div>

          <h2>
            Historial
          </h2>

          <p>
            Ventas y movimientos del sistema
          </p>

        </div>

      </div>

      <button
        class="danger-btn"
        onclick="limpiarHistorial()"
      >
        Limpiar historial
      </button>

    </div>

    <!-- CONTENT -->
    <div class="page-content">

      <!-- FILTROS -->
      <div class="box filtros-box fade-in">

        <div class="filtros-grid">

          <div>

            <label>
              Desde
            </label>

            <input
              type="date"
              id="fechaDesde"
            >

          </div>

          <div>

            <label>
              Hasta
            </label>

            <input
              type="date"
              id="fechaHasta"
            >

          </div>

          <button
            onclick="filtrarVentas()"
          >
            Filtrar
          </button>

          <button
            onclick="renderVentas()"
          >
            Ver todo
          </button>

        </div>

      </div>

      <!-- RESUMEN -->
      <div class="stats-grid fade-in">

        <div class="stat-card">

          <h3>
            Total vendido
          </h3>

          <h2 id="totalVentas">
            $0
          </h2>

        </div>

        <div class="stat-card">

          <h3>
            Efectivo
          </h3>

          <h2 id="totalEfectivo">
            $0
          </h2>

        </div>

        <div class="stat-card">

          <h3>
            Digital
          </h3>

          <h2 id="totalDigital">
            $0
          </h2>

        </div>

        <div class="stat-card">

          <h3>
            Cantidad ventas
          </h3>

          <h2 id="cantidadVentas">
            0
          </h2>

        </div>

      </div>

      <!-- TABLA -->
      <div class="table-box fade-in">

        <div class="table-header">

          <h3>
            Ventas registradas
          </h3>

        </div>

        <table class="pro-table">

          <thead>

            <tr>

              <th>
                Fecha
              </th>

              <th>
                Método
              </th>

              <th>
                Usuario
              </th>

              <th>
                Total
              </th>

              <th>
                Detalle
              </th>

            </tr>

          </thead>

          <tbody id="listaVentas"></tbody>

        </table>

      </div>

      <!-- TIMELINE -->
      <div class="box fade-in">

        <div class="table-header">

          <h3>
            Actividad del sistema
          </h3>

        </div>

        <div
          id="listaHistorial"
          class="timeline-list"
        ></div>

      </div>

    </div>

  </main>

</div>

<!-- SCRIPTS -->

<script
  defer
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"
></script>

<script defer src="js/supabase.js"></script>
<script defer src="js/storage.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/toast.js"></script>
<script defer src="js/roles.js"></script>
<script defer src="js/historial.js"></script>
<script defer src="js/app.js"></script>

</body>
</html>
