<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Caja
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/ventas.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- ================================= -->
<!-- LAYOUT -->
<!-- ================================= -->

<div class="layout">

  <!-- ================================= -->
  <!-- SIDEBAR -->
  <!-- ================================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <div class="brand">

          <div class="brand-icon">

  <img
    src="assets/icons/images/logo.png"
    alt="FAUSTI"
  >

</div>

      </div>

    </div>

    <!-- NAV -->
    <nav class="sidebar-nav">

      <a
        href="index.html"
        class="nav-link"
      >
        <b>Inicio</b>
      </a>

      <a
        href="ventas.html"
        class="nav-link"
      >
        <b>Ventas</b>
      </a>

      <a
        href="productos.html"
        class="nav-link"
      >
        <b>Productos</b>
      </a>

      <a
        href="caja.html"
        class="nav-link active"
      >
        <b>Caja</b>
      </a>

      <a
        href="produccion.html"
        class="nav-link"
      >
        <b>Producción</b>
      </a>

      <a
        href="proveedores.html"
        class="nav-link admin-only"
      >
        <b>Proveedores</b>
      </a>


    </nav>

    <!-- USER -->
    <div class="user-box">

      <div class="user-info">

        <small class="user-role">
          Sesión activa
        </small>

      </div>

      <button
        type="button"
        onclick="logout()"
        class="switch-btn"
      >

        🔄 Cerrar Sesión

      </button>

    </div>

  </aside>
<div
  id="sidebarOverlay"
  class="sidebar-overlay"
  onclick="toggleSidebar()"
></div>
  <!-- ================================= -->
  <!-- MAIN -->
  <!-- ================================= -->

  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
<button
  class="menu-toggle"
  onclick="toggleSidebar()"
>
  ☰
</button>
      <div class="topbar-left">

        <div>

          <h2>
            💰 Caja diaria
          </h2>

          <p>
            Control financiero del local
          </p>

        </div>

      </div>

    </div>

    <!-- ================================= -->
    <!-- CONTENT -->
    <!-- ================================= -->

    <div class="page-content">

      <!-- ================================= -->
      <!-- STATS -->
      <!-- ================================= -->

      <div class="stats-grid">

        <div class="stat-card green">

          <h2 id="montoApertura">
            $0
          </h2>

          <p>
            APERTURA
          </p>

        </div>

        <div class="stat-card blue">

          <h2 id="saldo">
            $0
          </h2>

          <p>
            SALDO ACTUAL
          </p>

        </div>

        <div class="stat-card orange">

          <h2 id="diferenciaCaja">
            $0
          </h2>

          <p>
            DIFERENCIA
          </p>

        </div>

        <div class="stat-card green">

          <h2 id="totalIngresos">
            $0
          </h2>

          <p>
            INGRESOS
          </p>

        </div>

        <div class="stat-card red">

          <h2 id="totalEgresos">
            $0
          </h2>

          <p>
            EGRESOS
          </p>

        </div>

        <div class="stat-card blue">

          <h2 id="saldoActual">
            $0
          </h2>

          <p>
            SALDO
          </p>
      
        </div>
<div class="stat-card green">

        <h2 id="diezPorciento">>
          $0
        </h2>

        <p>
          10% DE LAS VENTAS
        </p>
      </div>
      </div>

      <!-- ================================= -->
      <!-- APERTURA -->
      <!-- ================================= -->

      <div
        class="box fade-in"
        style="margin-bottom: 30px;"
      >

        <h3>
          🔓 Apertura de caja
        </h3>

        <div class="form">

          <input
            type="number"
            id="montoInicial"
            placeholder="Monto inicial"
            min="0"
          />

          <button
            type="button"
            onclick="abrirCaja()"
          >

            Abrir caja

          </button>

        </div>

      </div>

      <!-- ================================= -->
      <!-- CIERRE -->
      <!-- ================================= -->

      <div
        class="box fade-in"
        style="margin-bottom: 30px;"
      >

        <h3>
          🔒 Cierre de caja
        </h3>

        <div class="form">

          <input
            type="number"
            id="montoCierre"
            placeholder="Monto cierre"
            min="0"
          />

          <button
            type="button"
            onclick="cerrarCaja()"
          >

            Cerrar caja

          </button>

        </div>

      </div>

      <!-- ================================= -->
      <!-- MOVIMIENTOS -->
      <!-- ================================= -->

      <div class="box fade-in">

        <h3>
          Registrar movimiento
        </h3>

        <div class="form">

          <select id="tipo">

            <option value="ingreso">
              Ingreso
            </option>

            <option value="egreso">
              Egreso
            </option>

          </select>

          <input
            type="number"
            id="monto"
            placeholder="Monto"
            min="0"
          >

          <input
            type="text"
            id="motivo"
            placeholder="Motivo"
            autocomplete="off"
          >

          <button
            type="button"
            onclick="registrarMovimiento()"
          >

            Registrar

          </button>

        </div>

      </div>

      <!-- ================================= -->
      <!-- LIMPIAR -->
      <!-- ================================= -->

      <button
        type="button"
        class="btn-danger"
        onclick="limpiarCaja()"
      >

        🗑 Limpiar movimientos

      </button>

      <!-- ================================= -->
      <!-- LISTA -->
      <!-- ================================= -->

      <div class="box fade-in">

        <div class="table-header">

          <h3>
            Movimientos
          </h3>

        </div>

        <div
          id="listaCaja"
          class="lista"
        ></div>

      </div>

    </div>

  </main>

</div>

<!-- ================================= -->
<!-- COMMAND PALETTE -->
<!-- ================================= -->

<div
  id="commandPalette"
  class="command-palette hidden"
>

  <div class="command-box">

    <input
      type="text"
      id="commandInput"
      placeholder="Buscar productos, ventas o módulos..."
      autocomplete="off"
      oninput="buscarGlobal()"
    >

    <div id="commandResults"></div>

  </div>

</div>

<!-- ================================= -->
<!-- SCRIPTS -->
<!-- ================================= -->

<script
  defer
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"
  onerror="console.error('Error cargando Supabase')"
></script>

<script defer src="js/supabase.js"></script>

<script defer src="js/storage.js"></script>

<script defer src="js/auth.js"></script>

<script defer src="js/toast.js"></script>

<script defer src="js/roles.js"></script>

<script defer src="js/caja.js"></script>

<script defer src="js/app.js"></script>

</body>
</html>
