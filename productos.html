<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos</title>
  <link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/ventas.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/darkmode.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">🧊</div>
        <div>
          <h2>Fausti</h2>
          <p>Sistema de Gestión</p>
        </div>
      </div>
      <button class="collapse-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="nav-link"><b>Inicio</b></a>
      <a href="ventas.html" class="nav-link"><b>Ventas</b></a>
      <a href="productos.html" class="nav-link active"><b>Productos</b></a>
      <a href="caja.html" class="nav-link"><b>Caja</b></a>
      <a href="produccion.html" class="nav-link"><b>Producción</b></a>
      <a href="proveedores.html" class="nav-link admin-only"><b>Proveedores</b></a>
      <a href="historial.html" class="nav-link admin-only"><b>Historial</b></a>
      
    </nav>
<div class="user-box">

  <div class="user-avatar">
    👤
  </div>

  <div class="user-info">

    <p id="userNombre">
      Usuario
    </p>

    <small class="user-role">
      Sesión activa
    </small>

  </div>

  <button
    onclick="window.location.href='login.html'"
    class="switch-btn"
  >
    🔄 Cambiar cuenta
  </button>

  <button
    onclick="logout()"
    class="logout-btn"
  >
    🚪 Cerrar sesión
  </button>

  <button
    onclick="toggleDarkMode()"
    class="logout-btn"
  >
    🌙 Modo oscuro
  </button>

</div>
  </aside>

  <main class="main">

    <div class="topbar">
      <h2>Productos</h2>
      <span class="badge">Inventario</span>
    </div>

    <div class="page-content">

      <div class="box fade-in">
        <h3>Agregar producto</h3>

        <div class="form product-form">
          <input id="nombre" placeholder="Nombre">
          <input id="precio" type="number" placeholder="Precio">
          <input id="costo" type="number" placeholder="Costo">
          <input id="stock" type="number" placeholder="Stock">
          <input id="unidad" placeholder="Unidad: kg, unidad, litro">

          <select id="tipo">
            <option value="reventa">Venta</option>
            <option value="elaborado">Reventa</option>
            <option value="elaborado">Elaboración</option>
          </select>

          <button onclick="agregarProducto()">Agregar</button>
        </div>
      </div>

      <div class="table-box fade-in">
        <div class="table-header">
          <h3>Listado de productos</h3>
          <input id="buscador" placeholder="Buscar..." onkeyup="filtrarProductos()">
        </div>

        <table class="pro-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Precio</th>
              <th>Costo</th>
              <th>Stock</th>
              <th>Tipo</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="listaProductos"></tbody>
        </table>
      </div>

    </div>

  </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/roles.js"></script>
<script src="js/productos.js"></script>
<script src="js/app.js"></script>
<div id="commandPalette" class="command-palette hidden">

  <div class="command-box">

    <input
      type="text"
      id="commandInput"
      placeholder="Buscar productos, ventas o módulos..."
      oninput="buscarGlobal()"
    >

    <div id="commandResults"></div>

  </div>

</div>
</body>
</html>
